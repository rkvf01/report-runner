
[project]
name = "Report-Runner"
version = "0.1.0"
description = "CLI based report generator from AWS Athena, REST APIs and othe data sources"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "typer>=0.12.0",
  "pyyaml>=6.0.0",
  "pydantic>=2.0.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "boto3>=1.34.0",
  "python-dotenv>=1.0.0"
]

[project.scripts]
report-runner = "runner.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runner*"]
exclude = ["reports*"]
